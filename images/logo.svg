<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a0b14"/>
    </linearGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Silver Chrome Gradient -->
    <linearGradient id="logoSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Red Magic Shield Emblem (Left Side) -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex Shield -->
    <polygon points="50,5 95,28 95,72 50,95 5,72 5,28" 
             fill="#090d16" stroke="url(#logoRedGrad)" stroke-width="2.5" filter="url(#logoGlow)"/>
    
    <!-- Inner Dark Core -->
    <polygon points="50,14 86,33 86,67 50,86 14,67 14,33" 
             fill="#0d1322" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.5"/>

    <!-- RM Geometric Monogram -->
    <!-- R Blade -->
    <path d="M 28,32 L 44,32 L 50,48 L 36,48 L 47,72 L 34,72 L 28,56 L 28,72 L 20,72 L 20,32 Z" 
          fill="url(#logoSilverGrad)"/>
    <path d="M 28,38 L 38,38 L 36,44 L 28,44 Z" fill="#0d1322"/>

    <!-- M Blade -->
    <path d="M 54,32 L 63,32 L 70,54 L 77,32 L 86,32 L 86,72 L 77,72 L 77,48 L 72,64 L 68,64 L 63,48 L 63,72 L 54,72 Z" 
          fill="url(#logoRedGrad)"/>

    <!-- Center Power Crystal -->
    <polygon points="50,45 54,53 50,61 46,53" fill="#ffffff" filter="url(#logoGlow)"/>
    
    <!-- Neon Corner Dots -->
    <circle cx="50" cy="5" r="2" fill="#ff1e42"/>
    <circle cx="95" cy="28" r="2" fill="#ff1e42"/>
    <circle cx="95" cy="72" r="2" fill="#ff1e42"/>
    <circle cx="50" cy="95" r="2" fill="#ff1e42"/>
    <circle cx="5" cy="72" r="2" fill="#ff1e42"/>
    <circle cx="5" cy="28" r="2" fill="#ff1e42"/>
  </g>

  <!-- Typography (Arabic & English) -->
  <g transform="translate(485, 0)">
    <!-- Arabic Store Name: ريد ماجيك -->
    <text x="0" y="58" text-anchor="end" 
          fill="url(#logoSilverGrad)" 
          stroke="#ff1e42" stroke-width="1" stroke-opacity="0.3"
          font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', 'Segoe UI', Tahoma, sans-serif" 
          font-size="44" font-weight="900" letter-spacing="0">
      ريد ماجيك
    </text>

    <!-- English Sub-Brand: RED MAGIC -->
    <text x="0" y="86" text-anchor="end" 
          fill="url(#logoRedGrad)" 
          font-family="'Readex Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" font-weight="800" letter-spacing="6">
      RED MAGIC
    </text>

    <!-- Subtitle / Categories Tagline -->
    <text x="0" y="106" text-anchor="end" 
          fill="#94a3b8" 
          font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', 'Segoe UI', Tahoma, sans-serif" 
          font-size="11.5" font-weight="600">
      لخدمات المحمول الذكية • الإكسسوارات • كاش
    </text>
  </g>

  <!-- Separator Vertical Line -->
  <line x1="120" y1="20" x2="120" y2="100" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
