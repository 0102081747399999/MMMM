<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="thBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030611"/>
      <stop offset="35%" stop-color="#0a1226"/>
      <stop offset="70%" stop-color="#180a1d"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="thBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="thGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="thCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <radialGradient id="thCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="thNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="thShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#thBgGrad)"/>
  <ellipse cx="800" cy="200" rx="650" ry="200" fill="url(#thCenterGlow)"/>

  <!-- Top and Bottom Borders -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#thBlue)"/>
  <rect x="0" y="396" width="1600" height="4" fill="url(#thCrimson)"/>

  <!-- Holographic World Coordinate Grid Lines -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <ellipse cx="800" cy="200" rx="450" ry="170"/>
    <ellipse cx="800" cy="200" rx="350" ry="130"/>
    <ellipse cx="800" cy="200" rx="240" ry="90"/>
    <line x1="800" y1="20" x2="800" y2="380"/>
    <line x1="350" y1="200" x2="1250" y2="200"/>
  </g>

  <!-- Telecom Satellite Dish Silhouettes (Left & Right) -->
  <g transform="translate(180, 100)" stroke="url(#thBlue)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 40,150 A 80 80 0 0 1 120,40" stroke-width="4"/>
    <line x1="80" y1="95" x2="140" y2="70"/>
    <circle cx="140" cy="70" r="4" fill="#60a5fa"/>
    <!-- Transmission Waves -->
    <path d="M 150,60 A 25 25 0 0 1 170,85" stroke-dasharray="4,4"/>
    <path d="M 160,50 A 40 40 0 0 1 190,95" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(1260, 100)" stroke="url(#thCrimson)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 120,150 A 80 80 0 0 0 40,40" stroke-width="4"/>
    <line x1="80" y1="95" x2="20" y2="70"/>
    <circle cx="20" cy="70" r="4" fill="#ff2a55"/>
    <path d="M 10,60 A 25 25 0 0 0 -10,85" stroke-dasharray="4,4"/>
    <path d="M 0,50 A 40 40 0 0 0 -30,95" stroke-dasharray="4,4"/>
  </g>

  <!-- ==========================================
       CENTER BRAND EMBLEM: لوجو "حلمي" - سنترال حلمي المركزي
       ========================================== -->
  <g transform="translate(800, 185)" filter="url(#thShadow)">
    <circle cx="0" cy="0" r="110" fill="#060c1c" stroke="url(#thGold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#thBlue)" stroke-width="1.8" stroke-dasharray="6,4"/>

    <!-- Orbital Cyber Rings -->
    <ellipse cx="0" cy="0" rx="142" ry="46" transform="rotate(-30)" fill="none" stroke="url(#thGold)" stroke-width="2.2" filter="url(#thNeon)"/>
    <circle cx="120" cy="-64" r="5" fill="#facc15"/>
    <ellipse cx="0" cy="0" rx="142" ry="46" transform="rotate(30)" fill="none" stroke="url(#thCrimson)" stroke-width="2.2" filter="url(#thNeon)"/>
    <circle cx="-120" cy="-64" r="5" fill="#ff2a55"/>

    <!-- Shield Plate -->
    <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="#0b162c" stroke="url(#thGold)" stroke-width="2.5"/>

    <!-- Arabic Typography LOGO: حلمي -->
    <text x="0" y="15" text-anchor="middle" fill="url(#thGold)" font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', sans-serif" font-size="38" font-weight="900" filter="url(#thNeon)">
      حلمي
    </text>
    <text x="0" y="34" text-anchor="middle" fill="#60a5fa" font-family="'Readex Pro', sans-serif" font-size="9" font-weight="800" letter-spacing="4">
      CENTRAL HILMY POS
    </text>

    <!-- Top Telecom Antenna Icon -->
    <path d="M 0,-52 L 0,-34" stroke="url(#thGold)" stroke-width="2.5"/>
    <circle cx="0" cy="-52" r="3.5" fill="#facc15" filter="url(#thNeon)"/>
    <path d="M -10,-48 A 12 12 0 0 1 10,-48" fill="none" stroke="url(#thGold)" stroke-width="1.5"/>
    <path d="M -16,-54 A 18 18 0 0 1 16,-54" fill="none" stroke="url(#thCrimson)" stroke-width="1.5"/>
  </g>
</svg>