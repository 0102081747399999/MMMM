<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="35%" stop-color="#0e1322"/>
      <stop offset="70%" stop-color="#1b0a16"/>
      <stop offset="100%" stop-color="#08060c"/>
    </linearGradient>

    <linearGradient id="spCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="spGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="spSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <radialGradient id="spCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#be123c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="spNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="spShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <pattern id="spGrid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#e11d48" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1.5" fill="#f43f5e" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#spBgGrad)"/>
  <rect width="1600" height="400" fill="url(#spGrid)"/>
  
  <ellipse cx="800" cy="200" rx="600" ry="200" fill="url(#spCenterGlow)"/>
  <ellipse cx="400" cy="180" rx="300" ry="140" fill="url(#spGoldGlow)"/>

  <!-- Glowing Top & Bottom Bars -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#spCrimson)"/>
  <rect x="0" y="396" width="1600" height="4" fill="url(#spCrimson)"/>

  <!-- Perspective Showroom Floor -->
  <polygon points="0,400 1600,400 1480,270 120,270" fill="#080c18" fill-opacity="0.85"/>
  <line x1="120" y1="270" x2="1480" y2="270" stroke="#e11d48" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="280" y1="270" x2="160" y2="400" stroke="#e11d48" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="520" y1="270" x2="440" y2="400" stroke="#e11d48" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="800" y1="270" x2="800" y2="400" stroke="#e11d48" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="1080" y1="270" x2="1160" y2="400" stroke="#e11d48" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="1320" y1="270" x2="1440" y2="400" stroke="#e11d48" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Circuit Tech Lines -->
  <g stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 120,60 L 220,60 L 270,110 L 420,110"/>
    <circle cx="420" cy="110" r="4" fill="#e11d48" fill-opacity="0.8"/>
    <path d="M 1480,60 L 1380,60 L 1330,110 L 1180,110"/>
    <circle cx="1180" cy="110" r="4" fill="#facc15" fill-opacity="0.8"/>
  </g>

  <!-- ==========================================
       CENTER BRAND CREST: لوجو "حلمي" الفاخر
       ========================================== -->
  <g transform="translate(800, 180)" filter="url(#spShadow)">
    <!-- Outer Shield Halo -->
    <circle cx="0" cy="0" r="105" fill="#080c16" stroke="url(#spGold)" stroke-width="2.5" stroke-opacity="0.75"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#spCrimson)" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.7"/>

    <!-- Orbital Light Rings -->
    <ellipse cx="0" cy="0" rx="138" ry="44" transform="rotate(-25)" fill="none" stroke="url(#spGold)" stroke-width="2" filter="url(#spNeon)"/>
    <circle cx="115" cy="-56" r="4" fill="#facc15"/>
    <ellipse cx="0" cy="0" rx="138" ry="44" transform="rotate(25)" fill="none" stroke="url(#spCrimson)" stroke-width="2" filter="url(#spNeon)"/>
    <circle cx="-115" cy="-56" r="4" fill="#ff2a55"/>

    <!-- Center Shield Plate -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0a0e1a" stroke="url(#spGold)" stroke-width="2.5"/>
    <polygon points="0,-48 40,-24 40,24 0,48 -40,24 -40,-24" fill="#140813" stroke="url(#spCrimson)" stroke-width="1.8"/>

    <!-- Arabic Typography LOGO: حلمي -->
    <text x="0" y="14" text-anchor="middle" fill="url(#spGold)" font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', sans-serif" font-size="36" font-weight="900" filter="url(#spNeon)">
      حلمي
    </text>
    <text x="0" y="32" text-anchor="middle" fill="#f8fafc" font-family="'Readex Pro', sans-serif" font-size="9" font-weight="800" letter-spacing="3">
      HILMY TELECOM
    </text>

    <!-- Top Crown Star -->
    <path d="M 0,-40 L 4,-30 L 12,-30 L 6,-24 L 8,-14 L 0,-20 L -8,-14 L -6,-24 L -12,-30 L -4,-30 Z" fill="url(#spGold)"/>
  </g>

  <!-- ==========================================
       RIGHT SHOWCASE: FLAGSHIP SMARTPHONES
       ========================================== -->
  <g transform="translate(1080, 80)" filter="url(#spShadow)">
    <!-- Pedestal Platform -->
    <polygon points="30,225 270,225 300,250 0,250" fill="#0d1424" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="250" x2="300" y2="250" stroke="url(#spCrimson)" stroke-width="2" filter="url(#spNeon)"/>

    <!-- Phone 1 (Foreground) -->
    <g transform="translate(110, 20) rotate(8)">
      <rect x="0" y="0" width="85" height="175" rx="14" fill="#090d16" stroke="url(#spSilver)" stroke-width="2.5"/>
      <rect x="4" y="4" width="77" height="167" rx="10" fill="#070a12" stroke="url(#spCrimson)" stroke-width="1"/>
      <ellipse cx="42" cy="70" rx="30" ry="42" fill="url(#spCenterGlow)"/>
      <circle cx="42" cy="14" r="3" fill="#1e293b"/>
      <line x1="28" y1="160" x2="56" y2="160" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Phone 2 (Background) -->
    <g transform="translate(25, 45) rotate(-10)">
      <rect x="0" y="0" width="80" height="165" rx="13" fill="#05080f" stroke="#475569" stroke-width="2"/>
      <rect x="4" y="4" width="72" height="157" rx="9" fill="#070a12"/>
      <ellipse cx="40" cy="65" rx="26" ry="38" fill="url(#spGoldGlow)"/>
      <rect x="10" y="10" width="22" height="46" rx="6" fill="#0f172a" stroke="url(#spGold)" stroke-width="1"/>
      <circle cx="21" cy="22" r="5" fill="#020617"/>
      <circle cx="21" cy="42" r="5" fill="#020617"/>
    </g>
  </g>

  <!-- ==========================================
       LEFT SHOWCASE: CURVED DISPLAY & ACCESSORIES
       ========================================== -->
  <g transform="translate(200, 80)" filter="url(#spShadow)">
    <!-- Pedestal Platform -->
    <polygon points="30,225 270,225 300,250 0,250" fill="#0d1424" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="250" x2="300" y2="250" stroke="url(#spGold)" stroke-width="2" filter="url(#spNeon)"/>

    <!-- Foldable / Curved Screen Tablet -->
    <g transform="translate(60, 30) rotate(-6)">
      <rect x="0" y="0" width="135" height="165" rx="12" fill="#080c18" stroke="url(#spSilver)" stroke-width="2"/>
      <rect x="4" y="4" width="127" height="157" rx="9" fill="#05070e"/>
      <ellipse cx="67" cy="80" rx="50" ry="50" fill="url(#spGoldGlow)"/>
      <line x1="67" y1="4" x2="67" y2="161" stroke="url(#spCrimson)" stroke-width="1.5" stroke-opacity="0.6"/>
    </g>

    <!-- Smart Stylus Pen -->
    <g transform="translate(210, 50) rotate(22)">
      <rect x="0" y="0" width="7" height="145" rx="3.5" fill="url(#spSilver)" stroke="#334155" stroke-width="1"/>
      <polygon points="0,145 3.5,158 7,145" fill="url(#spGold)"/>
      <circle cx="3.5" cy="12" r="2" fill="#ff2a55" filter="url(#spNeon)"/>
    </g>
  </g>
</svg>