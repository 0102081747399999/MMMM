<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04090b"/>
      <stop offset="35%" stop-color="#081816"/>
      <stop offset="70%" stop-color="#161208"/>
      <stop offset="100%" stop-color="#04080a"/>
    </linearGradient>

    <linearGradient id="chGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="chAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="chCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="chSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <radialGradient id="chCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="chNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#chBgGrad)"/>
  <ellipse cx="800" cy="200" rx="600" ry="200" fill="url(#chCenterGlow)"/>

  <!-- Top and Bottom Borders -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#chGreen)"/>
  <rect x="0" y="396" width="1600" height="4" fill="url(#chAmber)"/>

  <!-- High-Voltage Energy Grid & Lightning Paths -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" fill="none">
    <path d="M 100,80 L 250,80 L 290,130 L 450,130"/>
    <circle cx="450" cy="130" r="4" fill="#10b981"/>
    <path d="M 1500,80 L 1350,80 L 1310,130 L 1150,130"/>
    <circle cx="1150" cy="130" r="4" fill="#f59e0b"/>
  </g>

  <!-- ==========================================
       CENTER BRAND EMBLEM: لوجو "حلمي" - الشواحن والطاقة
       ========================================== -->
  <g transform="translate(800, 185)" filter="url(#chShadow)">
    <circle cx="0" cy="0" r="105" fill="#061210" stroke="url(#chAmber)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#chGreen)" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Dual Energy Lightning Arcs -->
    <path d="M -80,-50 L -60,-8 L -45,-8 L -20,60" fill="none" stroke="url(#chGreen)" stroke-width="2" stroke-linecap="round" filter="url(#chNeon)"/>
    <path d="M 80,-50 L 60,-8 L 45,-8 L 20,60" fill="none" stroke="url(#chAmber)" stroke-width="2" stroke-linecap="round" filter="url(#chNeon)"/>

    <!-- Shield Plate -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0b1c18" stroke="url(#chAmber)" stroke-width="2.5"/>

    <!-- Arabic Typography LOGO: حلمي -->
    <text x="0" y="14" text-anchor="middle" fill="url(#chAmber)" font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', sans-serif" font-size="36" font-weight="900" filter="url(#chNeon)">
      حلمي
    </text>
    <text x="0" y="32" text-anchor="middle" fill="#34d399" font-family="'Readex Pro', sans-serif" font-size="9" font-weight="800" letter-spacing="3">
      FAST CHARGERS &amp; GaN
    </text>

    <!-- Top Lightning Bolt Icon -->
    <polygon points="0,-45 8,-33 1,-33 4,-20 -6,-30 0,-30" fill="url(#chAmber)" filter="url(#chNeon)"/>
  </g>

  <!-- ==========================================
       RIGHT SHOWCASE: GaN FAST CHARGERS & CABLES
       ========================================== -->
  <g transform="translate(1120, 80)" filter="url(#chShadow)">
    <!-- 120W Multi-Port GaN Desktop Station -->
    <g transform="translate(60, 30)">
      <rect x="0" y="0" width="120" height="90" rx="14" fill="#0d1816" stroke="url(#chGreen)" stroke-width="2.5"/>
      <!-- Glowing Ports -->
      <rect x="20" y="25" width="24" height="10" rx="3" fill="#050a08" stroke="url(#chAmber)" stroke-width="1.5"/>
      <rect x="20" y="45" width="24" height="10" rx="3" fill="#050a08" stroke="url(#chGreen)" stroke-width="1.5"/>
      <rect x="20" y="65" width="24" height="10" rx="3" fill="#050a08" stroke="url(#chGreen)" stroke-width="1.5"/>
      <circle cx="85" cy="45" r="16" fill="#081412" stroke="url(#chGreen)" stroke-width="1.5"/>
      <text x="85" y="49" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="800">120W</text>
    </g>

    <!-- Braided Ultra-Fast Cable Curve -->
    <g transform="translate(30, 110)">
      <path d="M 10,90 Q 60,10 140,50 T 200,80" fill="none" stroke="url(#chAmber)" stroke-width="5" stroke-linecap="round" filter="url(#chNeon)"/>
      <path d="M 10,90 Q 60,10 140,50 T 200,80" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Gold Alloy Connector Head -->
      <rect x="180" y="70" width="25" height="12" rx="4" fill="url(#chAmber)" transform="rotate(25, 180, 70)"/>
    </g>
  </g>

  <!-- ==========================================
       LEFT SHOWCASE: LUXURY SHOCKPROOF COVERS & CASES
       ========================================== -->
  <g transform="translate(240, 80)" filter="url(#chShadow)">
    <!-- Heavy Duty Armor Case -->
    <g transform="translate(40, 20) rotate(-8)">
      <rect x="0" y="0" width="85" height="175" rx="16" fill="#0a1412" stroke="url(#chGreen)" stroke-width="2.5"/>
      <!-- Corner Bumper Shock Absorbers -->
      <rect x="-3" y="-3" width="16" height="16" rx="4" fill="url(#chAmber)"/>
      <rect x="72" y="-3" width="16" height="16" rx="4" fill="url(#chAmber)"/>
      <rect x="-3" y="162" width="16" height="16" rx="4" fill="url(#chAmber)"/>
      <rect x="72" y="162" width="16" height="16" rx="4" fill="url(#chAmber)"/>
      <!-- Magnetic Ring Armor Plate -->
      <circle cx="42" cy="85" r="26" fill="none" stroke="url(#chSilver)" stroke-width="3" stroke-dasharray="8,4"/>
      <circle cx="42" cy="85" r="14" fill="#040c0a" stroke="url(#chGreen)" stroke-width="1.5"/>
    </g>

    <!-- Clear Crystal Case Silhouette -->
    <g transform="translate(140, 45) rotate(12)">
      <rect x="0" y="0" width="80" height="165" rx="14" fill="#081614" fill-opacity="0.7" stroke="url(#chAmber)" stroke-width="2"/>
      <ellipse cx="40" cy="80" rx="30" ry="50" fill="url(#chGreen)" fill-opacity="0.15"/>
    </g>
  </g>
</svg>