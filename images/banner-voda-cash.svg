<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090305"/>
      <stop offset="35%" stop-color="#1c050a"/>
      <stop offset="70%" stop-color="#2a060d"/>
      <stop offset="100%" stop-color="#0a0305"/>
    </linearGradient>

    <linearGradient id="vcRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <linearGradient id="vcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="vcEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <radialGradient id="vcCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e60000" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#990000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="vcNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="vcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#vcBgGrad)"/>
  <ellipse cx="800" cy="200" rx="600" ry="200" fill="url(#vcCenterGlow)"/>

  <!-- Top and Bottom Borders -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#vcRed)"/>
  <rect x="0" y="396" width="1600" height="4" fill="url(#vcGold)"/>

  <!-- Interconnected 18-Line Network Constellation Tracks -->
  <g stroke="#e60000" stroke-width="1.2" stroke-opacity="0.3" fill="none">
    <circle cx="800" cy="185" r="160" stroke-dasharray="6,6"/>
    <circle cx="800" cy="185" r="230" stroke-dasharray="8,6"/>
    <circle cx="800" cy="185" r="310" stroke-dasharray="10,8"/>
  </g>

  <!-- 18 SIM Line Nodes Orbiting -->
  <!-- Left Orbit Nodes (Lines 1 to 9) -->
  <g transform="translate(800, 185)">
    <!-- Node 1 -->
    <circle cx="-190" cy="-60" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="-190" y="-56" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">1</text>
    <!-- Node 2 -->
    <circle cx="-250" cy="-20" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="-250" y="-16" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">2</text>
    <!-- Node 3 -->
    <circle cx="-280" cy="40" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="-280" y="44" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">3</text>
    <!-- Node 4 -->
    <circle cx="-220" cy="90" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="-220" y="94" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">4</text>
    <!-- Node 5 -->
    <circle cx="-350" cy="-10" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="-350" y="-6" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">5</text>
    <!-- Node 6 -->
    <circle cx="-390" cy="60" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="-390" y="64" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">6</text>
    <!-- Node 7 -->
    <circle cx="-450" cy="-40" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="-450" y="-36" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">7</text>
    <!-- Node 8 -->
    <circle cx="-490" cy="25" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="-490" y="29" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">8</text>
    <!-- Node 9 -->
    <circle cx="-530" cy="85" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="-530" y="89" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">9</text>

    <!-- Right Orbit Nodes (Lines 10 to 18) -->
    <!-- Node 10 -->
    <circle cx="190" cy="-60" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="190" y="-56" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">10</text>
    <!-- Node 11 -->
    <circle cx="250" cy="-20" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="250" y="-16" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">11</text>
    <!-- Node 12 -->
    <circle cx="280" cy="40" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="280" y="44" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">12</text>
    <!-- Node 13 -->
    <circle cx="220" cy="90" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="220" y="94" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">13</text>
    <!-- Node 14 -->
    <circle cx="350" cy="-10" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="350" y="-6" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">14</text>
    <!-- Node 15 -->
    <circle cx="390" cy="60" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="390" y="64" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">15</text>
    <!-- Node 16 -->
    <circle cx="450" cy="-40" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="450" y="-36" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">16</text>
    <!-- Node 17 -->
    <circle cx="490" cy="25" r="14" fill="#170408" stroke="url(#vcRed)" stroke-width="1.8"/>
    <text x="490" y="29" text-anchor="middle" fill="#ff1a1a" font-family="monospace" font-size="9" font-weight="900">17</text>
    <!-- Node 18 -->
    <circle cx="530" cy="85" r="14" fill="#170408" stroke="url(#vcGold)" stroke-width="1.8"/>
    <text x="530" y="89" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="9" font-weight="900">18</text>
  </g>

  <!-- ==========================================
       CENTER BRAND EMBLEM: لوجو "حلمي" - الـ 18 خط كاش
       ========================================== -->
  <g transform="translate(800, 185)" filter="url(#vcShadow)">
    <circle cx="0" cy="0" r="105" fill="#120306" stroke="url(#vcGold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#vcRed)" stroke-width="2"/>

    <!-- Dual Cash Flow Rotating Arrows -->
    <!-- Green Deposit Arrow -->
    <path d="M -70,-60 A 92 92 0 0 1 70,-60" fill="none" stroke="url(#vcEmerald)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="76,-56 66,-66 62,-52" fill="#34d399"/>
    <!-- Red Withdrawal Arrow -->
    <path d="M 70,60 A 92 92 0 0 1 -70,60" fill="none" stroke="url(#vcRed)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-76,56 -66,66 -62,52" fill="#ff1a1a"/>

    <!-- Shield Plate -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#1a0409" stroke="url(#vcGold)" stroke-width="2.5"/>

    <!-- Arabic Typography LOGO: حلمي -->
    <text x="0" y="14" text-anchor="middle" fill="url(#vcGold)" font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', sans-serif" font-size="36" font-weight="900" filter="url(#vcNeon)">
      حلمي
    </text>
    <text x="0" y="32" text-anchor="middle" fill="#facc15" font-family="'Readex Pro', sans-serif" font-size="9" font-weight="800" letter-spacing="3">
      18 VODA CASH LINES
    </text>

    <!-- Top SIM Chip Icon -->
    <rect x="-12" y="-45" width="24" height="16" rx="3" fill="url(#vcGold)"/>
    <path d="M -12,-41 L -8,-45" stroke="#120306" stroke-width="2"/>
    <circle cx="0" cy="-37" r="2.5" fill="#120306"/>
  </g>
</svg>