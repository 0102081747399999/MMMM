<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="auBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080512"/>
      <stop offset="30%" stop-color="#140926"/>
      <stop offset="65%" stop-color="#240718"/>
      <stop offset="100%" stop-color="#07040d"/>
    </linearGradient>

    <linearGradient id="auCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="auCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="auGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="auSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <radialGradient id="auCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="auNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="auShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#auBgGrad)"/>
  <ellipse cx="800" cy="200" rx="650" ry="200" fill="url(#auCenterGlow)"/>

  <!-- Top and Bottom Borders -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#auCrimson)"/>
  <rect x="0" y="396" width="1600" height="4" fill="url(#auCyan)"/>

  <!-- Equalizer Audio Spectrum Bars (Background Waves) -->
  <g opacity="0.35" transform="translate(100, 240)">
    <!-- Left Equalizer -->
    <rect x="0" y="-80" width="8" height="80" rx="4" fill="url(#auCyan)"/>
    <rect x="18" y="-120" width="8" height="120" rx="4" fill="url(#auCyan)"/>
    <rect x="36" y="-60" width="8" height="60" rx="4" fill="url(#auCrimson)"/>
    <rect x="54" y="-140" width="8" height="140" rx="4" fill="url(#auCrimson)"/>
    <rect x="72" y="-100" width="8" height="100" rx="4" fill="url(#auGold)"/>
    <rect x="90" y="-160" width="8" height="160" rx="4" fill="url(#auGold)"/>
    <rect x="108" y="-70" width="8" height="70" rx="4" fill="url(#auCyan)"/>
    <rect x="126" y="-110" width="8" height="110" rx="4" fill="url(#auCrimson)"/>
  </g>

  <g opacity="0.35" transform="translate(1360, 240)">
    <!-- Right Equalizer -->
    <rect x="0" y="-110" width="8" height="110" rx="4" fill="url(#auCrimson)"/>
    <rect x="18" y="-70" width="8" height="70" rx="4" fill="url(#auCyan)"/>
    <rect x="36" y="-160" width="8" height="160" rx="4" fill="url(#auGold)"/>
    <rect x="54" y="-100" width="8" height="100" rx="4" fill="url(#auGold)"/>
    <rect x="72" y="-140" width="8" height="140" rx="4" fill="url(#auCrimson)"/>
    <rect x="90" y="-60" width="8" height="60" rx="4" fill="url(#auCrimson)"/>
    <rect x="108" y="-120" width="8" height="120" rx="4" fill="url(#auCyan)"/>
    <rect x="126" y="-80" width="8" height="80" rx="4" fill="url(#auCyan)"/>
  </g>

  <!-- ==========================================
       CENTER BRAND EMBLEM: لوجو "حلمي" - عالم الصوتيات
       ========================================== -->
  <g transform="translate(800, 185)" filter="url(#auShadow)">
    <circle cx="0" cy="0" r="105" fill="#0d0818" stroke="url(#auGold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#auCrimson)" stroke-width="1.5" stroke-dasharray="5,4"/>

    <!-- Concentric Soundwave Radiation Rings -->
    <circle cx="0" cy="0" r="125" fill="none" stroke="url(#auCyan)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8,6"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#auCrimson)" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Shield Plate -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#140a20" stroke="url(#auGold)" stroke-width="2.5"/>

    <!-- Arabic Typography LOGO: حلمي -->
    <text x="0" y="14" text-anchor="middle" fill="url(#auGold)" font-family="system-ui, -apple-system, 'Cairo', 'Readex Pro', sans-serif" font-size="36" font-weight="900" filter="url(#auNeon)">
      حلمي
    </text>
    <text x="0" y="32" text-anchor="middle" fill="#22d3ee" font-family="'Readex Pro', sans-serif" font-size="9" font-weight="800" letter-spacing="3">
      PRO AUDIO &amp; SOUND
    </text>

    <!-- Top Music Headphone Mini Icon -->
    <path d="M -16,-34 A 16 16 0 0 1 16,-34" fill="none" stroke="url(#auGold)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-18" y="-35" width="4" height="10" rx="2" fill="url(#auCrimson)"/>
    <rect x="14" y="-35" width="4" height="10" rx="2" fill="url(#auCrimson)"/>
  </g>

  <!-- ==========================================
       RIGHT SHOWCASE: STUDIO HEADPHONES & EARBUDS
       ========================================== -->
  <g transform="translate(1120, 85)" filter="url(#auShadow)">
    <!-- Over-Ear Studio Headphones -->
    <g transform="translate(50, 20)">
      <!-- Headband Arc -->
      <path d="M 20,110 A 75 75 0 0 1 160,110" fill="none" stroke="url(#auSilver)" stroke-width="10" stroke-linecap="round"/>
      <path d="M 30,105 A 65 65 0 0 1 150,105" fill="none" stroke="url(#auCrimson)" stroke-width="2.5"/>
      <!-- Left Ear Cup -->
      <rect x="6" y="90" width="30" height="66" rx="14" fill="#0f0b1a" stroke="url(#auCrimson)" stroke-width="3" filter="url(#auNeon)"/>
      <circle cx="21" cy="123" r="8" fill="url(#auGold)"/>
      <!-- Right Ear Cup -->
      <rect x="144" y="90" width="30" height="66" rx="14" fill="#0f0b1a" stroke="url(#auCrimson)" stroke-width="3" filter="url(#auNeon)"/>
      <circle cx="159" cy="123" r="8" fill="url(#auGold)"/>
    </g>

    <!-- Wireless Earbuds Charging Pod Case -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="60" height="46" rx="15" fill="#130e22" stroke="url(#auCyan)" stroke-width="2" filter="url(#auNeon)"/>
      <line x1="0" y1="18" x2="60" y2="18" stroke="#0891b2" stroke-width="1"/>
      <circle cx="30" cy="30" r="3" fill="#10b981"/>
    </g>
  </g>

  <!-- ==========================================
       LEFT SHOWCASE: POWERFUL SUBWOOFERS & BASS
       ========================================== -->
  <g transform="translate(260, 85)" filter="url(#auShadow)">
    <!-- Portable Cylinder Party Subwoofer -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="160" height="90" rx="20" fill="#100b1e" stroke="url(#auCyan)" stroke-width="2.5"/>
      <!-- Dual Bass Cones with RGB Rings -->
      <circle cx="48" cy="45" r="28" fill="#090514" stroke="url(#auCrimson)" stroke-width="3" filter="url(#auNeon)"/>
      <circle cx="48" cy="45" r="14" fill="url(#auSilver)"/>
      <circle cx="112" cy="45" r="28" fill="#090514" stroke="url(#auCyan)" stroke-width="3" filter="url(#auNeon)"/>
      <circle cx="112" cy="45" r="14" fill="url(#auSilver)"/>
      <!-- Passive Radiator End Caps -->
      <ellipse cx="0" cy="45" rx="6" ry="30" fill="url(#auGold)"/>
      <ellipse cx="160" cy="45" rx="6" ry="30" fill="url(#auGold)"/>
    </g>

    <!-- Bluetooth Capsule Mini Speaker -->
    <g transform="translate(70, 140)">
      <rect x="0" y="0" width="80" height="40" rx="14" fill="#170d2b" stroke="url(#auGold)" stroke-width="2"/>
      <circle cx="25" cy="20" r="12" fill="#0b0616" stroke="url(#auCrimson)" stroke-width="1.5"/>
      <circle cx="55" cy="20" r="12" fill="#0b0616" stroke="url(#auCyan)" stroke-width="1.5"/>
    </g>
  </g>
</svg>