<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Crimson Neon Gradient -->
    <linearGradient id="iconRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="iconSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hex/Rounded Card -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#090d16" stroke="url(#iconRedGrad)" stroke-width="2.5" filter="url(#iconGlow)"/>
  <rect x="8" y="8" width="104" height="104" rx="20" fill="#0d1322" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.4"/>

  <!-- RM Emblem Center -->
  <g transform="translate(10, 10)">
    <!-- R Blade -->
    <path d="M 24,28 L 42,28 L 49,46 L 33,46 L 46,74 L 31,74 L 24,56 L 24,74 L 15,74 L 15,28 Z" 
          fill="url(#iconSilverGrad)"/>
    <path d="M 24,35 L 35,35 L 33,41 L 24,41 Z" fill="#0d1322"/>

    <!-- M Blade -->
    <path d="M 53,28 L 63,28 L 71,53 L 79,28 L 88,28 L 88,74 L 78,74 L 78,47 L 73,65 L 68,65 L 63,47 L 63,74 L 53,74 Z" 
          fill="url(#iconRedGrad)"/>

    <!-- Center Glowing Diamond -->
    <polygon points="50,42 55,51 50,60 45,51" fill="#ffffff" filter="url(#iconGlow)"/>
  </g>

  <!-- Bottom Mini Tech Text -->
  <text x="60" y="104" text-anchor="middle" fill="#ff1e42" font-family="'Readex Pro', sans-serif" font-size="9" font-weight="900" letter-spacing="2">RED MAGIC</text>
</svg>
